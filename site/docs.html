<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Ship's Docs — {{VESSEL_NAME}}</title>

  <!-- OpenGraph / social sharing -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="{{VESSEL_NAME}} — Ship's Docs" />
  <meta property="og:description" content="Standard operating procedures, systems reference and checklists for {{VESSEL_NAME}}." />
  <meta property="og:url"         content="{{SITE_URL}}docs.html" />
  <meta property="og:image"       content="{{LOGO_URL}}" />
  <meta name="description"        content="Standard operating procedures, systems reference and checklists for {{VESSEL_NAME}}." />

  <link rel="icon" href="{{ICON_PATH}}" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{VESSEL_NAME}}" />
  <link rel="apple-touch-icon" href="{{ICON_PATH}}" />
  <link rel="stylesheet" href="assets/styles.css" />

  <!-- Set the theme before first paint so the page does not flash light. -->
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'marine');
    } catch { document.documentElement.setAttribute('data-theme', 'marine'); }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <!-- User stylesheet. Optional, never written by the plugin: add assets/custom.css
       to your repository to override anything above it. A 404 here is harmless. -->
  <link rel="stylesheet" href="assets/custom.css" />
</head>
<body>
  <button id="darkModeToggle" class="floating-dark-mode-btn">Marine</button>
  <div class="container">

    <!-- HEADER -->
    <div id="status-hero">
      <div class="status-hero__left">
        <img src="{{LOGO_PATH}}" alt="{{VESSEL_NAME}}" class="status-hero__logo" data-logo />
        <span id="status-vessel">Ship's Docs</span>
      </div>
      <div class="status-hero__right">
        <div id="status-sentence">Standard operating procedures &amp; systems reference</div>
        <div id="status-age"><a href="index.html" class="docs-back-link">&larr; Back to the tracker</a></div>
      </div>
    </div>

    <div class="docs-layout">

      <!-- SIDEBAR -->
      <aside class="docs-sidebar" id="docs-sidebar">
        <label class="docs-search" for="docs-search-input">
          <span class="docs-search__icon" aria-hidden="true">⌕</span>
          <input
            id="docs-search-input"
            type="search"
            placeholder="Search documents…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <nav class="docs-nav" id="docs-nav" aria-label="Documents">
          <div class="docs-nav__empty">Loading documents…</div>
        </nav>
      </aside>

      <!-- READING PANE -->
      <main class="docs-main" id="docs-main">
        <div class="docs-doc-header" id="docs-doc-header" style="display:none;">
          <h1 id="docs-doc-title"></h1>
          <div class="docs-doc-meta" id="docs-doc-meta"></div>
        </div>
        <article class="docs-article markdown-body" id="docs-article">
          <p class="docs-placeholder">Loading…</p>
        </article>
      </main>

    </div><!-- /.docs-layout -->
  </div><!-- /.container -->

  <div class="footer">
    <img src="{{LOGO_PATH}}" alt="{{VESSEL_NAME}}" class="footer-logo" data-logo />
    <div>Published by <a href="https://github.com/zackphillips/signalk-github-pages" target="_blank" rel="noopener">signalk-github-pages</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="assets/constants.js"></script>
  <script src="assets/docs.js?v=1"></script>
</body>
</html>
