<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GitHub Pages Vessel Tracker">
  <!-- The plugin's icon in the Signal K admin UI and app store.

       A theme meant to be copied into sibling plugins: a travel-poster view
       of the Golden Gate at dusk. Keep everything down to the fog, replace
       the subject.

         Sky      #0e1a2e to #f3b27c at the horizon (y 44)
         Sea      #3a3550 to #0b1422
         Sun      #ffe4b8, set on the horizon at x 43, with a soft glow
         Marin    #5b3d52, the headlands behind the tower
         Bridge   #d2452c, International Orange; #a8321f for the deck,
                  #8f2a1c for the shaded face of the tower. Fine lines only.
         Fog      a pale band across the tower's foot
         Subject  #0e1a2e, a solid silhouette against the sun, inside
                  x 30–56, y 24–47, sitting on the horizon.

       Examples for the subject: an anchor, a buoy, a lighthouse, a wind
       vane. This plugin's is a sloop.

       Detailed on purpose: it is drawn for the 64px and up app grid, not a
       favicon. site/assets/icon.svg is the site's fallback, ships into every
       adopter's repository, and stays generic. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="above"><rect width="64" height="44"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1a2e"/>
      <stop offset=".5" stop-color="#34385a"/>
      <stop offset=".82" stop-color="#c9745a"/>
      <stop offset="1" stop-color="#f3b27c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="44" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="43" cy="44" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd9a3" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd9a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="37" x2="0" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4e6dc" stop-opacity="0"/>
      <stop offset=".6" stop-color="#f4e6dc" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f4e6dc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="44" fill="url(#sky)"/>
    <rect y="44" width="64" height="20" fill="url(#sea)"/>

    <!-- Sun, set on the horizon -->
    <g clip-path="url(#above)">
      <circle cx="43" cy="44" r="18" fill="url(#glow)"/>
      <circle cx="43" cy="44" r="9.5" fill="#ffe4b8"/>
    </g>
    <g stroke="#ffd9a3" stroke-linecap="round">
      <path d="M38 46.5h12" stroke-width="1" opacity=".7"/>
      <path d="M40 49h8" stroke-width=".9" opacity=".5"/>
      <path d="M41.5 51.5h5" stroke-width=".8" opacity=".35"/>
      <path d="M42.8 54h2.4" stroke-width=".7" opacity=".25"/>
    </g>

    <!-- Marin headlands -->
    <path fill="#5b3d52" opacity=".85" d="M-2 44V39.5C4 37.5 9 36 15 37.2S25 40 31 41.6 36 43.4 38 44z"/>

    <!-- Cables, suspenders and deck -->
    <g fill="none" stroke="#d2452c" stroke-linecap="round">
      <path d="M17 8Q30 31 68 30" stroke-width="1.1"/>
      <path d="M13 8Q7 20 -4 26" stroke-width="1.1"/>
      <path d="M24 17.5V34M29 22.2V34M34 25V34M40 27V34M46 28.3V34M52 29.1V34M58 29.6V34M5 21.5V34M9 17V34" stroke-width=".35" opacity=".7"/>
      <path d="M-2 34H66" stroke-width="1.6" stroke="#a8321f"/>
    </g>

    <!-- Tower: tapered legs, portals narrowing toward the top -->
    <path fill="#d2452c" fill-rule="evenodd" d="M10.6 5.5h1.8l.2 1.5h4.8l.2-1.5h1.8l.3 3 .8 38h-10.8l.8-38z
      M13 10.5h4v5.2h-4z M13 17.5h4v6.2h-4z M13 25.5h4v7.4h-4z M12.8 35.5h4.4v11h-4.4z"/>
    <path fill="#8f2a1c" opacity=".55" d="M17.2 7l.8 1.5.8 38h-1.6z"/>

    <!-- Fog -->
    <rect y="37" width="64" height="10" fill="url(#fog)"/>

    <!-- Subject: a sloop against the sun -->
    <g fill="#0e1a2e">
      <path d="M41.2 29.5c1.6 4 3.6 9 5 14.2h-5z"/>
      <path d="M40.2 32c-1.5 3.8-2.6 7.6-3.3 11.7h3.3z"/>
      <path d="M35.5 44.4h12.5l-1.6 1.6h-9.6z"/>
    </g>
  </g>
</svg>
