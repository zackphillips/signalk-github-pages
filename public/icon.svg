<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GitHub Pages Vessel Tracker">
  <!-- The plugin's icon in the Signal K admin UI and app store.

       A theme meant to be copied into sibling plugins: keep the tile and the
       bridge, replace the glyph.

         Tile    #12202f, the bay at night. Rounded 12 on a 64 grid.
         Bridge  #f05a28, International Orange lifted for contrast on the
                 tile. One Golden Gate tower and its cable, 3px line art,
                 cropped by the tile. Never changes between plugins.
         Glyph   #eef2f5, fog. Solid shapes, no line art, so it reads against
                 the bridge at 16px. Lives in x 26–58, y 12–56, right of the
                 tower. A 2.5px stroke in the tile colour, painted under the
                 fill, knocks the bridge out behind it.

       Examples for the glyph slot: an anchor, a gauge needle, a tide curve.
       This plugin's is a sloop.

       Not the site's fallback icon: site/assets/icon.svg ships into every
       adopter's repository and stays generic. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#12202f"/>

    <!-- Bridge -->
    <g fill="none" stroke="#f05a28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main cable: back span to the left, main span sagging to the right -->
      <path d="M-2 28Q8 21 15 9Q30 36 66 38"/>
      <!-- Tower: two legs and the portal struts -->
      <path d="M11 9V66M19 9V66M11 16H19M11 26H19"/>
      <!-- Deck -->
      <path d="M-2 40H66"/>
    </g>

    <!-- Glyph -->
    <g fill="#eef2f5" stroke="#12202f" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">
      <!-- Clears the bridge between the sails, where the mast would be -->
      <path d="M40 20h5v23h-5z" fill="#12202f" stroke="none"/>
      <!-- Mainsail -->
      <path d="M44 14L56 43H44z"/>
      <!-- Headsail -->
      <path d="M41 20L30 43h11z"/>
      <!-- Hull -->
      <path d="M27 47h31l-5 8H32z"/>
    </g>
  </g>
</svg>
