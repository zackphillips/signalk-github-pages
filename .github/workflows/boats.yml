name: Boat count

# Counts the sites running this plugin, for the README badge. Each published
# page carries <meta name="generator" content="signalk-github-pages">, so a
# code search for it finds one index.html per boat. The result goes to
# boats.json on the `badges` branch, which shields.io reads as an endpoint
# badge. Sites published before 1.0.3 have no tag and are not counted.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count repositories carrying the generator tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # grep exits 1 on no input, which is a real answer (zero boats), so it
          # is allowed to; a failed search still fails the step through pipefail
          # and leaves the last good count in place.
          boats=$(gh api --paginate -X GET search/code \
              -f q='signalk-github-pages generator path:index.html' -f per_page=100 \
              --jq '.items[].repository.full_name' \
            | { grep -v -i -x "$GITHUB_REPOSITORY" || true; } \
            | sort -u | wc -l)
          echo "boats=$boats"
          printf '{"schemaVersion":1,"label":"boats","message":"%s","color":"0a7ea4"}\n' "$boats" \
            > "$RUNNER_TEMP/boats.json"
      - name: Publish to the badges branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth=1 origin badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/boats.json" boats.json
          git add boats.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update boat count'
          git push origin badges
