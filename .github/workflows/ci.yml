name: CI

on:
  # Branch pushes are covered by the pull_request trigger; running both fires
  # every job twice on a PR branch.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the oldest Node still receiving security updates, and the
        # floor the engines field declares; 22 is what a current OpenPlotter
        # image ships.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
