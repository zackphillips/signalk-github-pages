name: Publish

# Pushing a v* tag publishes that version to npm. npm trusts this workflow
# through OIDC (trusted publishing, configured on the package's npm settings
# page), so no npm token is stored anywhere and every version carries a
# provenance attestation.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment named in the npm trusted publisher entry.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Check the tag matches package.json and the changelog
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## $version' entry"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prepublishOnly builds dist/ again; no token, npm authenticates over OIDC.
      - run: npm publish --provenance --access public
